/* Consolidated outreach and rejection details */

function rowsFromFile(matrix){const headers=data.headers.map(s=>String(s).toLowerCase().trim()),head=matrix[0].map(s=>String(s||'').toLowerCase().trim());const columns=headers.map(h=>head.indexOf(h));if(columns[0]<0||columns[10]<0)throw Error('정리 시트의 지역·수강생 상태 현황 열이 필요합니다.');const rows=matrix.slice(1).filter(r=>['본부','광산','북구'].includes(String(r[columns[0]]))).map(r=>columns.map(i=>i<0?'':r[i]||''));if(!rows.length)throw Error('유효한 데이터가 없습니다.');return rows}

 if(/^(x|×|❌|미진행|없음|없었습니다\.?|안했습니다\.?|진행하지못하고.*|아직진행하지못.*|진행전|미실시|무)$/.test(v)||/^(0|영)\s*(회|번)?$/.test(v))return '0회';

 const range=v.match(/(\d+)\s*[-~,～]\s*(\d+)\s*(회|번)?/);
 if(range)return Number(range[1])>=10?'10회 이상':Number(range[1])+'회';
 const explicit=v.match(/(\d+)\s*(회|번)/);
 if(explicit)return Number(explicit[1])>=10?'10회 이상':Number(explicit[1])+'회';
 if(/^(\d+)$/.test(v))return Number(v)>=10?'10회 이상':Number(v)+'회';
 if(/1대1/.test(v))return '1회';
 if(/안했|없었|못했|못하고|미진행|미실시|진행전|진행하지않/.test(v))return '0회';
 return '확인 필요';
}
function bars(items,total,maximum){const list=items.slice(0,maximum??items.length);const biggest=Math.max(1,...list.map(x=>x[1]));return '<div class="barRows">'+list.map(([label,n],i)=>'<div class="barRow"><div class="barInfo"><span class="barName">'+(i+1)+'위 · '+clean(label)+'</span><b>'+number(n)+'건 <small style="color:#8292a7">('+(total?n/total*100:0).toFixed(1)+'%)</small></b></div><div class="barTrack"><div class="barFill" style="width:'+(n/biggest*100)+'%;background:'+colors[i%colors.length]+'"></div></div></div>').join('')+'</div>'}
function card(i,group){const stat=group.stats[i];const id='q'+i;if(isHidden(id))return '';
 const itemlist=allRows(i,stat),total=stat.answered;
 if(!total)return '<article class="panel">'+heading(stat.name,id)+'<div class="empty">응답 없음</div></article>';
 const chartItems=itemlist;
 let chartBody='';
 {
  const radius=77,circ=2*Math.PI*radius;let offset=0;
  const svg='<circle cx="100" cy="100" r="77" fill="none" stroke="#eef2fa" stroke-width="30"/>'+
   chartItems.map(([value,qty],idx)=>{const span=qty/total*circ,tip=value+' · '+qty+'건 ('+(qty/total*100).toFixed(1)+'%)';const cir='<circle class="segments" tabindex="0" data-tip="'+clean(tip)+'" cx="100" cy="100" r="77" fill="none" stroke="'+colors[idx%colors.length]+'" stroke-width="30" stroke-dasharray="'+span+' '+circ+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 100 100)"><title>'+clean(tip)+'</title></circle>';offset+=span;return cir}).join('');
  const donut='<div class="pie"><svg viewBox="0 0 200 200">'+svg+'</svg><div class="pieCenter"><b>'+number(total)+'</b><small>응답</small></div></div>';
  const legend=chartItems.map(([v,n],idx)=>'<div class="legendrow"><span class="dot" style="background:'+colors[idx%colors.length]+'"></span><span class="legendText">'+clean(v)+'</span><strong>'+n+'건 <small>'+(n/total*100).toFixed(0)+'%</small></strong></div>').join('');
  chartBody='<div class="chartContent">'+donut+'<div class="legend">'+legend+'</div></div>';
 }
 return '<article class="panel '+(i===1?'departmentPanel':'')+'" data-item="'+id+'">'+heading(i===15?'담당 전도사님별 응답·등록·탈락 현황':stat.name,id)+chartBody+(i===15?pastorSummaryHtml():'')+(i===6?caseCombinedCard(group):'')+(i===11&&activeMode==='rejected'?otherReasonsHtml(group):'')+'</article>'
}
function pastorSummaryHtml(){
 // 전체/등록/탈락의 건수를 같은 담당 전도사님 이름으로 결합한다.
 const dataset=override||data;
 const getStats=mode=>dataset.groups[activeRegion+'|'+mode]?.stats?.[15]?.items||[];
 const all=new Map(getStats('all').map(([name,n])=>[String(name).trim(),Number(n)]));
 const registered=new Map(getStats('registered').map(([name,n])=>[String(name).trim(),Number(n)]));
 const rejected=new Map(getStats('rejected').map(([name,n])=>[String(name).trim(),Number(n)]));
 const names=[...new Set([...all.keys(),...registered.keys(),...rejected.keys()])].sort((a,b)=>(all.get(b)||0)-(all.get(a)||0)||a.localeCompare(b,'ko'));
 if(!names.length)return '';
 const rows=names.map(name=>{const total=all.get(name)||0,reg=registered.get(name)||0,rej=rejected.get(name)||0;
  const rate=total?(reg/total*100).toFixed(1):'0.0',rejectRate=total?(rej/total*100).toFixed(1):'0.0';
  return '<tr><th scope="row">'+clean(name)+'</th><td><strong>'+number(total)+'</strong>건</td><td>'+number(reg)+'건</td><td>'+number(rej)+'건</td><td class="rateGreen">'+rate+'%</td><td class="rateOrange">'+rejectRate+'%</td></tr>';}).join('');
 return '<div class="pastorSummary"><h4>전도사님별 카드 수 대비 등록·탈락</h4><div class="pastorScroll"><table class="pastorTable"><thead><tr><th>담당 전도사님</th><th>카드 수</th><th>등록</th><th>탈락</th><th>등록률</th><th>탈락률</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function caseCombinedCard(group){
 // 섭외유형 카드 내부에 TOP3 통합. 탭별 통계가 그대로 반영된다.
 function column(index,name){
  const list=(group.categories[String(index)]||[]).slice(0,3);
  const max=Math.max(1,...list.map(v=>v.count));
  return '<div class="caseColumn"><h4>'+name+'</h4>'+(list.map((v,i)=>'<div class="caseRowBlock"><div class="caseSummary"><span class="caseRank">'+(i+1)+'위</span><b class="caseTitle">'+clean(v.label)+'</b><strong class="caseCount">'+number(v.count)+'건</strong></div><div class="caseBar"><i style="width:'+(v.count/max*100)+'%;background:'+colors[i%colors.length]+'"></i></div></div>').join('')||'<div class="empty">응답 없음</div>')+'</div>';
 }
 return '<div class="outreachEmbedded"><h4 class="outreachHeading">개척 사례 TOP 3</h4><div class="caseColumns">'+column(7,'온라인 개척')+column(8,'오프라인 개척')+'</div></div>';
}
function otherReasonCategory(text){const v=String(text??'').toLowerCase().replace(/\s+/g,'');if(/거짓말|속임|사실과다름/.test(v))return '사실관계·신뢰 문제';if(/공황|약복용|우울|건강/.test(v))return '건강·복약 관련';if(/범죄|인성결격|결격사항/.test(v))return '적격성 관련';if(/이성교제|관계/.test(v))return '개인 관계 사유';return '기타 사유'}
function otherReasonsHtml(group){
 let list=group.otherReasons;
 if(!list){const m=new Map();for(const [v,n] of (group.stats[12]?.items||[])){const key=otherReasonCategory(v);m.set(key,(m.get(key)||0)+n)}list=[...m].map(([label,count])=>({label,count})).sort((a,b)=>b.count-a.count)}
 if(!list?.length)return '';
 const count=list.reduce((sum,x)=>sum+x.count,0);
 return '<div class="otherReasons"><h4>‘그 외’ 세부 사유 · '+count+'건</h4><div class="reasonTags">'+list.map(x=>'<div><span>'+clean(x.label)+'</span><b>'+x.count+'건</b></div>').join('')+'</div></div>';
}
function successCard(group){const id='success';if(isHidden(id))return '';
 const list=group.categories['13']||[],base=group.stats[13].answered||1,biggest=Math.max(1,...list.map(x=>x.count));
 return '<article class="successCard" data-item="success">'+heading('주 성공 요인 · 전체 순위',id)+list.map((x,i)=>'<div class="successRow"><div class="successHeader"><span class="caseRank">'+(i+1)+'위</span><b>'+clean(x.label)+'</b><strong>'+x.count+'건 · '+(x.count/base*100).toFixed(1)+'%</strong></div><div class="successBar"><i style="width:'+(x.count/biggest*100)+'%;background:'+colors[i%colors.length]+'"></i></div>'+x.examples.slice(0,2).map(y=>'<div class="successQuote">“'+clean(y)+'”</div>').join('')+'</div>').join('')+'</article>'}
function renderHiddenList(){const list=Object.keys(hiddenMap).filter(x=>hiddenMap[x]&&x.startsWith(activeMode+'|'));
 $('hiddenCount').textContent=list.length;const box=$('restoreList');
 if(!list.length){box.classList.add('hide');return}
 if(!box.dataset.open){box.classList.add('hide');return}
 const d=getGroup();box.classList.remove('hide');box.innerHTML=list.map(x=>{const k=x.split('|')[1];let label=k==='success'?'주 성공 요인':k==='caseCombined'?'온라인·오프라인 개척 사례 TOP 3':d.stats[Number(k.slice(1))]?.name||k;return '<button type="button" data-restore="'+clean(k)+'">+ '+clean(label)+'</button>'}).join('')}
function render(){if(!data)return;
 const d=getGroup(),title=activeMode==='all'?'전체':activeMode==='rejected'?'탈락한 경우':'등록된 경우';
 $('viewTitle').textContent=title+' · '+number(d.total)+'건';
 const common=[0,1,2,9,10,15];
 const detail=activeMode==='all'?[3,4,5,6]:(activeMode==='registered'?[3,4,5,6,9,14,15]:[3,4,5,6,9,10,14,15]);
 const ordered=activeMode==='all'?[...common,...detail]:detail;
 let html='';for(const i of ordered){html+=card(i,d)}
 $('primary').innerHTML=html;
 $('outcomeSection').classList.toggle('hide',activeMode==='all');
 $('outcomeHeading').classList.toggle('hide',activeMode==='registered');if(activeMode==='rejected'){$('outcomeTitle').textContent='탈락 원인 순위';$('outcome').innerHTML=card(11,d)}
 if(activeMode==='registered'){$('outcomeTitle').textContent='';$('outcome').innerHTML=successCard(d)}
 $('outcomeSection').classList.toggle('hide',activeMode==='all'||(activeMode==='registered'&&isHidden('success'))||(activeMode==='rejected'&&isHidden('q11')));
 renderHiddenList();
}
function setMode(mode){activeMode=mode;for(const b of document.querySelectorAll('.tabs button'))b.classList.toggle('active',b.dataset.mode===mode);$('restoreList').dataset.open='';render()}
function createFromRows(rows){const groups={};for(const reg of data.regions)for(const mode of ['all','rejected','registered'])groups[reg+'|'+mode]=summarizeRows(rows.filter(r=>(reg==='전체'||r[0]===reg)&&(mode==='all'||(mode==='registered'?r[10]==='등록':String(r[10]).includes('반려')))));return{headers:data.headers,regions:data.regions,groups}}
function csvParse(text){let arr=[],row=[],cell='',quote=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(Boolean))arr.push(row);cell=''}else cell+=c}row.push(cell);if(row.some(Boolean))arr.push(row);return arr}
async function unlock(pass){const cipher=PAYLOAD,salt=Uint8Array.from(atob(cipher.salt),c=>c.charCodeAt(0)),iv=Uint8Array.from(atob(cipher.iv),c=>c.charCodeAt(0)),body=Uint8Array.from(atob(cipher.cipher),c=>c.charCodeAt(0));const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass.trim()),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,body);return JSON.parse(new TextDecoder().decode(plain))}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='';if(!crypto?.subtle){$('error').textContent='HTTPS에서 열어주세요.';return}try{data=await unlock($('password').value);$('login').classList.add('hide');$('main').classList.remove('hide');$('region').innerHTML=data.regions.map(r=>'<option>'+clean(r)+'</option>').join('');setMode('all')}catch(err){$('error').textContent='비밀번호가 올바르지 않습니다.'}});
$('showPassword').addEventListener('change',e=>{$('password').type=e.target.checked?'text':'password'});
document.addEventListener('click',e=>{const h=e.target.closest('[data-hide]');if(h)hideQuestion(h.dataset.hide);const v=e.target.closest('[data-restore]');if(v)restoreQuestion(v.dataset.restore)});

$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-mode]');if(b)setMode(b.dataset.mode)});
$('region').addEventListener('change',e=>{activeRegion=e.target.value;render()});$('printBtn').addEventListener('click',()=>print());
const tooltip=$('tip');document.addEventListener('pointerover',e=>{const slice=e.target.closest?.('.segments');if(slice){tooltip.textContent=slice.dataset.tip;tooltip.hidden=false}});document.addEventListener('pointermove',e=>{if(!tooltip.hidden){tooltip.style.left=Math.min(innerWidth-tooltip.offsetWidth-12,e.clientX+12)+'px';tooltip.style.top=Math.min(innerHeight-tooltip.offsetHeight-12,e.clientY+12)+'px'}});document.addEventListener('pointerout',e=>{if(e.target.closest?.('.segments'))tooltip.hidden=true});document.addEventListener('focusin',e=>{if(e.target.closest?.('.segments')){tooltip.textContent=e.target.dataset.tip;tooltip.hidden=false;const r=e.target.getBoundingClientRect();tooltip.style.left=r.left+'px';tooltip.style.top=r.bottom+'px'}});document.addEventListener('focusout',e=>{if(e.target.closest?.('.segments'))tooltip.hidden=true});
